<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jandro Birthday World</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ff5ea8,#ffb347,#8a5cff);color:#fff;text-align:center;overflow-x:hidden}
h1{font-size:3rem;margin:20px;text-shadow:0 0 15px #000}
.header{width:220px;border-radius:50%;border:6px solid #fff;box-shadow:0 0 25px #fff}
.card{width:min(1100px,92%);margin:35px auto;padding:20px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border-radius:20px}
.wrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
iframe{width:560px;max-width:100%;height:315px;border:none;border-radius:16px}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center}
button{padding:14px 28px;border:none;border-radius:30px;background:#ff0066;color:#fff;font-size:18px;cursor:pointer}
button:hover{transform:scale(1.05)}
.hidden{display:none;margin-top:18px}
.hidden img{max-width:280px;border-radius:18px;box-shadow:0 0 25px #fff;animation:pop .7s}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.particle{position:fixed;top:-20px;width:10px;height:10px;border-radius:50%;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
footer{padding:50px;font-size:1.3rem}
</style>
</head>
<body>
<h1>🎂 Jandro Birthday World 🎂</h1>
<img class="header" src="images/header.jpg" alt="Jandro">

<section class="card">
<h2>Person 1</h2>
<div class="wrap">
<iframe src="https://www.youtube.com/embed/nCkpzqqog4k" allowfullscreen></iframe>
<div class="side">
<button onclick="reveal('img1',1)">🎁 Reveal Surprise</button>
<div id="img1" class="hidden">
<img src="images/person1.png" alt="Person 1">

</div>
</div>
</div>
</section>

<script>
function reveal(id,n){
 document.getElementById(id).style.display='block';
 const colors=['#ff0','#0ff','#f0f','#0f0','#f55','#5ff','#fff','#fa0'];
 let count=80+n*10;
 for(let i=0;i<count;i++){ 
   let d=document.createElement('div');
   d.className='particle';
   d.style.left=Math.random()*100+'vw';
   d.style.background=colors[(i+n)%colors.length];
   d.style.width=(6+Math.random()*12)+'px';
   d.style.height=d.style.width;
   d.style.animationDuration=(2+Math.random()*3)+'s';
   document.body.appendChild(d);
   setTimeout(()=>d.remove(),5000);
 }
}
</script>
