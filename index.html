<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jandro Birthday World</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#ff69b4;color:#fff;text-align:center;overflow-x:hidden}
h1{font-size:3rem;margin:20px}
.header{width:220px;border-radius:50%;border:6px solid #fff;box-shadow:0 0 25px #fff}
.card{width:min(1100px,92%);margin:35px auto;padding:20px;background:rgba(255,255,255,.15);border-radius:20px}
.wrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
iframe{width:560px;max-width:100%;height:315px;border:none;border-radius:16px}
.side{display:flex;flex-direction:column;align-items:center}
button{padding:14px 28px;border:none;border-radius:30px;background:#d81b60;color:#fff;font-size:18px;cursor:pointer}
.hidden{display:none;margin-top:18px}
.hidden img{max-width:280px;border-radius:18px;box-shadow:0 0 25px #fff;animation:pop .7s}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.particle{position:fixed;top:-20px;width:10px;height:10px;border-radius:50%;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
footer{padding:40px;font-size:1.2rem}
</style>
</head>
<body>
<h1>Jandro Birthday World</h1>
<img class="header" src="images/header.jpg" alt="Header">

<section class="card">
<h2>Person 1</h2>
<div class="wrap">
<iframe src="https://www.youtube.com/embed/nCkpzqqog4k" allowfullscreen></iframe>
<div class="side">

<script>
function reveal(id,n){
 document.getElementById(id).style.display='block';
 const colors=['#fff','#ffe066','#ff8fab','#caffbf','#a0c4ff'];
 for(let i=0;i<80+n*10;i++){
  const d=document.createElement('div');
  d.className='particle';
  d.style.left=Math.random()*100+'vw';
  d.style.background=colors[Math.floor(Math.random()*colors.length)];
  const s=6+Math.random()*10;
  d.style.width=s+'px';
  d.style.height=s+'px';
  d.style.animationDuration=(2+Math.random()*3)+'s';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),5000);
 }
}
</script>
